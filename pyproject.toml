[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beakr-cli"
version = "0.4.0"
description = "CLI and MCP server for Beakr"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Beakr", email = "hello@thebeakr.com" }]
keywords = ["beakr", "wiki", "knowledge-graph", "mcp", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    # The Python SDK (BeakrHub/beakr-python). Until it is on PyPI it resolves
    # from the git pin in [tool.uv.sources] below; see the README's "The Python
    # SDK dependency" for switching to the PyPI release.
    "beakr-sdk>=0.1.0,<0.2",
    "typer>=0.15",
    "httpx>=0.27",
    "rich>=13",
    "mcp>=1.9,<2",
    "pydantic>=2",
    "keyring>=25",
    "packaging>=23",
    "typing-extensions>=4.7",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://thebeakr.com"
Repository = "https://github.com/BeakrHub/beakr-cli"
Issues = "https://github.com/BeakrHub/beakr-cli/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]
bench = [
    "anthropic>=1.13.0",
]

[project.scripts]
beakr = "beakr_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/beakr_cli"]

[tool.hatch.build.targets.wheel.force-include]
".claude/skills/beakr" = "beakr_cli/assets/skills/beakr"
".claude/commands" = "beakr_cli/assets/commands"

[tool.hatch.build.targets.sdist]
# The engine snapshot is for this repository's own checks, not the package.
exclude = ["snapshots"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Verbatim copies of other repositories' files (scripts/refresh_snapshots.py).
extend-exclude = ["snapshots"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated by scripts/generate_private_api.py (the SDK's generator): long type
# expressions are left whole, its imports keep the generator's order, and the
# freshness test requires the exact output.
"src/beakr_cli/_private_api/_generated/*" = ["E501", "I001"]

[tool.ruff.format]
exclude = ["src/beakr_cli/_private_api/_generated/*"]

[tool.mypy]
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
# Pinned to a pushed commit of BeakrHub/beakr-python until beakr-sdk is on PyPI.
# Bump with scripts/pin_sdk.sh <commit-or-tag> (see the README's "The Python SDK
# dependency").
beakr-sdk = { git = "https://github.com/BeakrHub/beakr-python", rev = "692f0bee2fa5486c99414abf4ae41678e33474b4" }

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
]
