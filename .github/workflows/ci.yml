# beakr-cli CI: tests, freshness against the engine contract, release checks.
#
# The `beakr api` command table, the vendored agent tool surface and the private
# client for the CLI's allowlisted unlisted operations are derived from the
# engine (docs/api/public-openapi.json, docs/api/agent-tool-surface.json, and the
# internal contract filtered to src/beakr_cli/_private_api/operations.allowlist).
# This workflow does not read the engine: it checks them against the engine
# files committed under snapshots/beakr-engine, pinned to an engine commit in
# snapshots/manifest.json (scripts/refresh_snapshots.py; scripts/regen.sh
# refreshes them from a local engine checkout). The engine's own CI checks this
# repository out on the branch named like its own and runs these checks and
# tests against the engine itself, including the tests that run the engine's
# code (tests/_engine.py real_engine), which skip here. It also runs the release
# check (scripts/prepare_release.py): versions in step, bumped as far as the
# contract change requires, with release notes derived from the API changelog.
# publish.yml calls this workflow and publishes only when it passes.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: tests-and-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The committed engine snapshot stands in for an engine checkout.
      BEAKR_ENGINE_PATH: ${{ github.workspace }}/snapshots/beakr-engine
      # Engine-comparing tests fail instead of skipping when a file is missing.
      BEAKR_REQUIRE_ENGINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Engine snapshot matches its manifest
        run: python3 scripts/refresh_snapshots.py verify

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen --extra dev

      # Self-hosted line only: every step below runs with the beakr-sdk a self-hosted
      # release bundles with this CLI (the self-hosted beakr-python line at
      # .github/bundled-sdk-revision, the commit the engine's full-client-sources.json
      # pins), not the lock's PyPI beakr-sdk 0.2.x, which lacks the 0.4 methods this
      # line's commands call (card types, review flags, cancels). Nothing is published
      # from this line, and the lock is unchanged. Every later `uv run` takes --no-sync,
      # which would otherwise put the lock's beakr-sdk back. Move the revision with
      # the release's beakr-sdk pin.
      - name: Install the beakr-sdk the release bundles
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < .github/bundled-sdk-revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "bad revision: $revision"; exit 1; }
          uv pip install --no-deps --reinstall \
            "beakr-sdk @ git+https://github.com/BeakrHub/beakr-python@${revision}"
          uv run --no-sync python -c \
            "import importlib.metadata as m; print('beakr-sdk', m.version('beakr-sdk'))" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: CLI command table is current
        run: uv run --no-sync python scripts/sync_operations.py --check

      - name: Vendored agent tool surface is current
        run: uv run --no-sync python scripts/sync_tool_surface.py --check

      - name: Private client is current with its allowlist
        run: uv run --no-sync python scripts/generate_private_api.py --check

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Install shells for completion tests
        id: shells
        # apt first, with short timeouts. When the Ubuntu mirror is unreachable (it
        # stopped resolving on GitHub runners on 2026-11-11), fish and zsh come from
        # conda-forge through a pinned, checksum-verified micromamba. If both fail,
        # the zsh and fish completion tests are skipped with a warning, never
        # silently: the run summary says so.
        run: |
          set -uo pipefail
          source=""
          if timeout 180 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
               -o Acquire::https::Timeout=20 update -qq \
             && timeout 240 sudo apt-get install -y --no-install-recommends fish zsh; then
            source=apt
          else
            echo "::warning::apt could not install fish and zsh; installing them from conda-forge"
            url=https://github.com/mamba-org/micromamba-releases/releases/download/2.10.0-0/micromamba-linux-64
            sha256=701f39c06f8e6a670a0e186c8479b9e5c0502a2f0cda6cef65d83bdd2875e8bd
            mamba="$RUNNER_TEMP/micromamba"
            if curl -fsSL --connect-timeout 20 --retry 5 --retry-all-errors --retry-delay 5 -o "$mamba" "$url" \
               && echo "${sha256}  $mamba" | sha256sum --check --strict \
               && chmod +x "$mamba" \
               && timeout 300 "$mamba" create -y -q -r "$RUNNER_TEMP/mamba-root" -p "$RUNNER_TEMP/shells" \
                    -c conda-forge --override-channels fish zsh; then
              echo "$RUNNER_TEMP/shells/bin" >> "$GITHUB_PATH"
              export PATH="$RUNNER_TEMP/shells/bin:$PATH"
              source=conda-forge
            fi
          fi
          if [[ -n "$source" ]] && fish --version && zsh --version; then
            echo "fish and zsh installed from $source" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "require=bash,zsh,fish,pwsh" >> "$GITHUB_OUTPUT"
            echo "fish=true" >> "$GITHUB_OUTPUT"
          else
            message="fish and zsh could not be installed (apt and conda-forge both failed): the zsh and fish completion tests are SKIPPED in this run"
            echo "::warning title=Completion tests skipped::$message"
            echo "**$message**" >> "$GITHUB_STEP_SUMMARY"
            echo "require=bash,pwsh" >> "$GITHUB_OUTPUT"
            echo "fish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests
        # Completion tests fail instead of skipping when a shell is missing.
        # PowerShell (pwsh) is preinstalled on ubuntu-latest runners.
        env:
          BEAKR_REQUIRE_SHELLS: ${{ steps.shells.outputs.require }}
        run: uv run --no-sync pytest -q

      - name: Fish shell completion
        if: steps.shells.outputs.fish == 'true'
        run: |
          set -euo pipefail
          # fish is installed by "Install shells for completion tests" above.
          # The script `beakr --show-completion` prints when run from fish
          # (Typer detects the shell from the parent process).
          uv run --no-sync fish -c 'beakr --show-completion' > /tmp/beakr.fish
          fish -n /tmp/beakr.fish
          # It is the standard Click source script for fish...
          _BEAKR_COMPLETE=source_fish uv run --no-sync beakr | diff - /tmp/beakr.fish
          # ...and, sourced, it completes real commands rather than merely parsing.
          uv run --no-sync fish -c 'source /tmp/beakr.fish; complete -C "beakr au"' > /tmp/beakr-fish-complete.txt
          cat /tmp/beakr-fish-complete.txt
          grep -q '^auth' /tmp/beakr-fish-complete.txt

      - name: Release versions and notes
        run: uv run --no-sync python scripts/prepare_release.py check

  # pyproject.toml declares requires-python >=3.10, and uv picks 3.10 on a Mac
  # whose only other Python is the system 3.9. The job above tests 3.12 only, so
  # a 3.11+ name (datetime.UTC in chatgpt_export.py) once broke every `beakr`
  # command on 3.10, `beakr mcp` included, at import. This job runs the tests
  # and a startup smoke test on the oldest supported version.
  python-310:
    name: tests-python-3.10
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BEAKR_ENGINE_PATH: ${{ github.workspace }}/snapshots/beakr-engine
      BEAKR_REQUIRE_ENGINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Install
        run: uv sync --frozen --extra dev

      # Self-hosted line only: as in tests-and-freshness, the suite runs with the
      # beakr-sdk the release bundles (.github/bundled-sdk-revision), not the
      # lock's PyPI beakr-sdk, and every later `uv run` takes --no-sync.
      - name: Install the beakr-sdk the release bundles
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < .github/bundled-sdk-revision)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "bad revision: $revision"; exit 1; }
          uv pip install --no-deps --reinstall \
            "beakr-sdk @ git+https://github.com/BeakrHub/beakr-python@${revision}"
          uv run --no-sync python -c \
            "import importlib.metadata as m; print('beakr-sdk', m.version('beakr-sdk'))"

      - name: The environment runs Python 3.10
        run: uv run --no-sync python -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 10), sys.version'

      - name: Startup smoke test
        run: |
          set -euo pipefail
          uv run --no-sync beakr --version
          uv run --no-sync beakr --help > /dev/null
          uv run --no-sync beakr mcp --help > /dev/null
          # Every module in the package imports, every command module included.
          uv run --no-sync python - <<'PY'
          import importlib
          import pkgutil

          import beakr_cli

          names = [m.name for m in pkgutil.walk_packages(beakr_cli.__path__, "beakr_cli.")]
          for name in names:
              importlib.import_module(name)
          commands = [n for n in names if n.startswith("beakr_cli.commands.")]
          assert commands, "no command modules found"
          print(f"imported {len(names)} modules, {len(commands)} of them commands")
          PY

      - name: Tests
        run: uv run --no-sync pytest -q
